[build-system]
requires = ["setuptools>=69.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "usbkey-host"
version = "0.1.0"
description = "Dockerized host-side application for ELEC 498 USB key project"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12.3",
  "rich>=13.7.1",
  "pyserial>=3.5",
  "pydantic>=2.7.1",
  "requests>=2.32.3",
]

[project.scripts]
usbkey = "usbkey.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["usbkey*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
